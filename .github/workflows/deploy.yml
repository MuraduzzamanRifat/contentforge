name: Deploy (Vercel)

# GitHub-driven deploy: every push to main, after CI is green, deploys to
# Vercel and prints the live URL. No-ops cleanly (does NOT fail) until the
# three Vercel secrets are set — so the repo is never red just for lacking
# deploy creds.
#
# One-time setup (only you can do this — it needs your Vercel account):
#   1. npm i -g vercel && vercel login && vercel link   (in the repo) — this
#      creates .vercel/project.json with orgId + projectId.
#   2. Create a token at https://vercel.com/account/tokens
#   3. Add three GitHub repo secrets (Settings → Secrets → Actions):
#        VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   4. In the Vercel project → Settings → Environment Variables, add
#        ANTHROPIC_API_KEY  (the Claude subscription path can't run on
#        serverless; the AI routes use the API key there). Without it the
#        UI still works and AI buttons return an honest "not connected".

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: vercel production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check deploy secrets
        id: gate
        env:
          VT: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN not set — skipping deploy. See deploy.yml header for one-time setup."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install Vercel CLI
        if: steps.gate.outputs.ready == 'true'
        run: pnpm add -g vercel@latest

      - name: Pull Vercel env (production)
        if: steps.gate.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        if: steps.gate.outputs.ready == 'true'
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy + capture URL
        if: steps.gate.outputs.ready == 'true'
        run: |
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "Live: $url"
          echo "### ✅ Deployed: [$url]($url)" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
